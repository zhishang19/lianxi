server:
  port: 8080

spring:
  application:
    name: camp-langchain4j-starter

# 训练营 LangChain4j 配置
# 二选一 LLM 后端, 通过环境变量切换, 不硬编码 Key
camp:
  llm:
    # ollama (本地, 集训机房推荐) 或 openai (云端 OpenAI 兼容 API)
    provider: ${CAMP_LLM_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_MODEL:qwen2.5:7b}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: ${OPENAI_MODEL:gpt-3.5-turbo}

logging:
  level:
    dev.langchain4j: INFO
    com.camp.langchain4j: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# BUG-18 修复: actuator 端点配置 (健康检查 + info)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
